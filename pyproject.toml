[tool.poetry]
name = "gomma"
version = "0.5.0"
description = "A collection of packages used at the Mainframe"
authors = ["Kristján Valur Jónsson <fkristjan@mainframeindustries.com>"]
repository = "https://github.com/mainframeindustries/py-gomma"
documentation = "https://mainframeindustries.github.io/py-gomma/"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"


[tool.poetry.dev-dependencies]
black = "^25.0.0"
isort = "^5.13.0"
flake8 = "^6.0.0"
pytest = "^8.0.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
include = '\.pyi?$'
target-version = ['py310', 'py311', 'py312', 'py313']
fast = true
exclude = '''
(
  /(                        # exclude a few common directories in the
    \.git                   # root of the project
    | \.pytest_cache
    | python-venv
    | \.venv
    | build
    | dist
    | \.tox
  ))
'''

[tool.isort]
profile = "black"

